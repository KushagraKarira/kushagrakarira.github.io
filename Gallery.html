<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Gallery showcasing graphic design and vector works by Kushagra Karira.">
<title>Gallery — Kushagra Karira</title>
<link rel="stylesheet" href="./style.css">
<script src="./header.js" defer></script>
<style>
body{width:min(92%,900px)}
.page{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(orientation:landscape) and (min-width:600px){.page{grid-template-columns:repeat(4,1fr)}}
.gallery{position:relative;aspect-ratio:1;background:#e5e5e5;border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gallery img{width:100%;height:100%;object-fit:contain;padding:12px;box-sizing:border-box;transition:transform .2s}
.gallery:hover img{transform:scale(1.04)}
.desc{position:absolute;inset:auto 0 0;padding:8px 10px;background:rgba(26,95,180,.92);color:#fafafa;font-size:.85em;font-weight:600;text-align:center;opacity:0;transition:opacity .18s;pointer-events:none}
.gallery:hover .desc,.gallery:focus-within .desc{opacity:1}
@media(prefers-color-scheme:dark){.gallery{background:#202020}}
</style>
</head>
