name: AppImage

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/AppImage.yml'


jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
      
      - name: Fix Dependencies
        run: ls && sudo apt install fuse libfuse2
      - name: Prepare AppImage
        run: sudo apt-get install nodejs npm wget && npm install -g appnativefy && appnativefy --name "Kushagra Karira" --url "https://kushagrakarira.com/" --favicon
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@master
        with:
          name: Kushagra-Karira-x86_64.AppImage
          path: /home/runner/appnativefy/Kushagra-Karira-x86_64.AppImage
      - name: Read release.md and use it as a body of new release
        id: read_release
        shell: bash
        run: |
          r=$(cat path/to/release.md)                       # <--- Read release.md (Provide correct path as per your repo)
          r="${r//'%'/'%25'}"                               # Multiline escape sequences for %
          r="${r//$'\n'/'%0A'}"                             # Multiline escape sequences for '\n'
          r="${r//$'\r'/'%0D'}"                             # Multiline escape sequences for '\r'
          echo "RELEASE_BODY=$r" >> $GITHUB_OUTPUT          # <--- Set environment variable

      - name: Upload Binaries to Release
        uses: svenstaro/upload-release-action@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          body: |
            ${{ steps.read_release.outputs.RELEASE_BODY }}  # <--- Use environment variables that was created earlier
