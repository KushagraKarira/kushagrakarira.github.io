name: AppImage

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/AppImage.yml'


jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@master
      
      - name: Fix Dependencies
        run: sudo apt install fuse libfuse2
      - name: Prepare AppImage
        run: sudo apt-get install nodejs npm wget && npm install -g appnativefy && appnativefy --name "Kushagra Karira" --url "https://kushagrakarira.com/" --favicon
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@master
        with:
          name: Kushagra-Karira-x86_64.AppImage
          path: /home/runner/appnativefy/Kushagra-Karira-x86_64.AppImage
          
          
      - name: Create Release
        id: create_release
        uses: actions/create-release@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ github.ref }}-prelease
          release_name: Release ${{ github.ref }} (prelease)
          body: |
            Test upload-to-github-release works with `actions/create-release`
          draft: false
          prerelease: false
      - uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "/home/runner/appnativefy/Kushagra-Karira-x86_64.AppImage"
          release_id: ${{ steps.create_release.outputs.id }}
          overwrite: true
          verbose: true
