name: AppImage

on:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/AppImage.yml'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Fix Dependencies
        run: sudo apt install fuse libfuse2

      - name: Prepare AppImage
        run: |
          sudo apt-get install nodejs npm wget
          npm install -g appnativefy
          appnativefy --name "Kushagra Karira" --url "https://kushagrakarira.com/" --favicon

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@main
        with:
          name: Kushagra-Karira-x86_64.AppImage
          path: /home/runner/appnativefy/Kushagra-Karira-x86_64.AppImage

      - name: Get current date
        id: get_date
        run: echo "::set-output name=date::$(date +'%Y%m%d')"

      - name: Create Release
        id: create_release
        uses: actions/create-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_date.outputs.date }}
          release_name: Release ${{ steps.get_date.outputs.date }}
          body: |
            Test upload-to-github-release works with `actions/create-release`
          draft: false
          prerelease: false

      - name: Upload to GitHub Release
        uses: xresloader/upload-to-github-release@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file: "/home/runner/appnativefy/Kushagra-Karira-x86_64.AppImage"
          release_id: ${{ steps.create_release.outputs.id }}
          overwrite: true
          verbose: true
