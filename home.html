          {/* Added div to display the time */}
          <div id="currentTime" style="text-align: center; margin-top: 10px;">
              {/* Time will be inserted here by JavaScript */}
          </div>

		  <script>
            function displayTime() {
              const now = new Date();
              // You might want to adjust options based on desired format/timezone
              const options = {
                hour: 'numeric',
                minute: 'numeric',
                second: 'numeric',
                timeZoneName: 'short' // Shows timezone abbreviation like IST, GMT etc.
                // timeZone: 'Asia/Kolkata' // Example: Explicitly set timezone if needed
              };
              // Using 'en-IN' locale for India, fallback to 'en-US'
              const formattedTime = now.toLocaleString(['en-IN', 'en-US'], options);
              const timeElement = document.getElementById("currentTime");
              if (timeElement) { // Check if element exists before updating
                timeElement.textContent = formattedTime;
              } else {
                console.error("Element with ID 'currentTime' not found.");
              }
            }

            // Ensure the DOM is loaded before trying to find the element
            // Although placing the script at the end of body often suffices
            // it's safer to wrap in DOMContentLoaded or place script after the element
            document.addEventListener('DOMContentLoaded', (event) => {
                 setInterval(displayTime, 1000); // Update time every second
                 displayTime(); // Initial display immediately
            });

          </script>
