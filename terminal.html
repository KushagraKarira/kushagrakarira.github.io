<!DOCTYPE html>
<html>
<head>
	<title>Linux Terminal</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<style>
		body {
			background-color: #000;
			color: #FFF;
			font-family: "Courier New", Courier, monospace;
			font-size: 14px;
			line-height: 1.5;
			margin: 0;
			padding: 0;
		}
		.container {
			padding: 20px;
		}
		.prompt {
		  color: #0F0;
		  display: inline-block;
		  margin-right: 10px;
		  user-select: none;
		  vertical-align: top;
		  width: 250px;
		}

		.input {
		    display: inline-block;
		    margin: 0;
		    padding: 0;
		    width: calc(100% - 250px);
		    outline: none;
		}

		.cursor {
		    display: inline-block;
		    width: 8px;
		    height: 14px;
		    background-color: #FFF;
		    margin-left: 5px;
		    animation: blink 1s infinite;
		}

		@keyframes blink {
		    50% {
		        opacity: 0;
		    }
		}
	</style>
</head>
<body>
	<div class="container">
		<div><span class="prompt">[~/Projects/kushagrakarira.com]$</span><span class="input" contentEditable="true"></span><span class="cursor"></span></div>
	</div>
	<script src="./terminal.js"></script>
</body>
</html>
