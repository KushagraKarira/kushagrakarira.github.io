<!DOCTYPE html>
<html>
  <head>
    <title>Google Calendar with Notifications</title>
  </head>
  <body>
    <h1>Google Calendar with Notifications</h1>
    <ul id="events"></ul>

    <script src="https://apis.google.com/js/api.js"></script>
    <script>
      gapi.load('client', init);

      function init() {
        gapi.client.init({
          apiKey: 'AIzaSyD-FUpa-2V23yXpqEXDnXjFsWNinaiLGPk',
          discoveryDocs: ['https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest'],
          clientId: '404371630601-gmvtunpc25p92sa7ihdq6gar2sh1hbe0.apps.googleusercontent.com',
          scope: 'https://www.googleapis.com/auth/calendar.readonly'
        }).then(function () {
          getEvents();
        });
      }

      function getEvents() {
        var request = gapi.client.calendar.events.list({
          'calendarId': '27s0kdhhnf5e2ge2u1qgcsoijo@group.calendar.google.com',
          'timeMin': (new Date()).toISOString(),
          'showDeleted': false,
          'singleEvents': true,
          'orderBy': 'startTime'
        });

        request.execute(function(response) {
          var events = response.items;
          if (events.length > 0) {
            for (var i = 0; i < events.length; i++) {
              var event = events[i];
              var start = event.start.dateTime || event.start.date;
              var eventDate = new Date(start);
              var eventName = event.summary;
              var eventDescription = event.description;
              var listItem = document.createElement('li');
              listItem.innerHTML = '<strong>' + eventName + '</strong> - ' + eventDate.toLocaleString() + '<br>' + eventDescription;
              document.getElementById('events').appendChild(listItem);

              // Display notification for upcoming events
              var now = new Date();
              var timeDiff = eventDate.getTime() - now.getTime();
              var minutesDiff = Math.round(timeDiff / (1000 * 60));
              if (minutesDiff <= 30 && minutesDiff >= 0) {
                var notification = new Notification(eventName, {
                  body: eventDate.toLocaleString() + '\n' + eventDescription
                });
              }
            }
          } else {
            console.log('No events found.');
          }
        });
      }
    </script>

  </body>
</html>
