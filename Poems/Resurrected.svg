         id="tspan2942">Another day begins,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="343.10641"
         id="tspan1375"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">anorher dream,</tspan><tspan
