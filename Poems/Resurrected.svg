         x="55.045853"
         y="403.82193"
         id="tspan1377"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">without your smile,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="464.53748"
         id="tspan1379"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">and without your anger,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="524.53748"
         id="tspan1381"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;" /><tspan
         sodipodi:role="line"
         x="55.045853"
         y="585.25293"
         id="tspan1383"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">this is your friend,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="645.96844"
         id="tspan1385"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">that used to walk beside you,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="706.68396"
         id="tspan1387"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">didn't realized that you left me,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="767.39948"
         id="tspan1389"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">while i was still following your steps,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="828.11499"
         id="tspan1391"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">falling and learning to walk,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="888.11499"
         id="tspan1393"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;" /><tspan
         sodipodi:role="line"
         x="55.045853"
         y="948.83051"
         id="tspan1395"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">just like you used to,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1009.546"
         id="tspan1397"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">come back and pick me up,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1070.2616"
         id="tspan1399"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">just like you used to,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1130.9771"
         id="tspan1401"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">forgive me for all my mistakes,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1190.9771"
         id="tspan1403"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;" /><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1251.6925"
         id="tspan1405"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">oh, friend where have you gone</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1312.4081"
         id="tspan1407"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">how far have you gone,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1373.1235"
         id="tspan1409"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">beyond life's reach,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1433.8391"
         id="tspan1411"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">where nobody would dream of,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1494.5546"
         id="tspan1413"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">where nobody could reach,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1554.5546"
         id="tspan1415"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;" /><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1615.2701"
         id="tspan1417"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">oh! friend in heaven,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1675.9856"
         id="tspan1419"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">forgive me once again,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1736.7012"
         id="tspan1421"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">with these steps to follow,</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1797.4166"
         id="tspan1427"
         style="font-style:normal;font-variant:normal;font-weight:bold;font-stretch:normal;font-family:'Circular Std Black';-inkscape-font-specification:'Circular Std Black, Bold';fill:#000000;">// i find myslef looking at a world you made</tspan><tspan
         sodipodi:role="line"
         x="55.045853"
         y="1858.1322"
         id="tspan1429"
