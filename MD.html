<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2PDF</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #f6f5f4;
            --header: #ebebeb;
            --text: #2e3436;
            --accent: #3584e4;
            --border: rgba(0,0,0,0.1);
            --card: #ffffff;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #242424;
                --header: #303030;
                --text: #ffffff;
                --border: rgba(255,255,255,0.1);
                --card: #1e1e1e;
            }
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Simplified Header */
        header {
            background-color: var(--header);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .title { font-size: 15px; font-weight: 600; }
        
        .controls { display: flex; gap: 8px; }

        button, .btn {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.primary {
            background: var(--accent);
            color: white;
            border: none;
        }

        button:active { opacity: 0.7; }

        /* Responsive Layout */
        main {
            display: flex;
            flex-direction: column; /* Mobile Default */
            flex: 1;
            overflow: hidden;
        }

        @media (min-width: 850px) {
            main { flex-direction: row; }
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--card);
        }

        .editor-pane { border-bottom: 1px solid var(--border); }

        @media (min-width: 850px) {
            .editor-pane { border-bottom: none; border-right: 1px solid var(--border); }
        }

        textarea {
            flex: 1;
            border: none;
            padding: 20px;
            resize: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            background: transparent;
            color: inherit;
        }

        #preview {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff; /* Always white for clarity */
            color: #000000;    /* Always black for contrast */
        }

        /* PDF High-Contrast Styles */
        .pdf-export-container {
            font-family: 'Inter', sans-serif;
            color: #000 !important;
            background: #fff !important;
            line-height: 1.5;
        }
        .pdf-export-container h1, .pdf-export-container h2 { color: #000 !important; border-bottom: 1px solid #ccc; }
        .pdf-export-container code { background: #f0f0f0; padding: 2px 4px; border-radius: 4px; }

        input[type="file"] { display: none; }
    </style>
</head>
<body>

<header>
    <div class="title">Markdown</div>
    <div class="controls">
        <label for="file-upload" class="btn">Open</label>
        <input type="file" id="file-upload" accept=".md">
        <button class="primary" onclick="exportPDF()">Export</button>
    </div>
</header>

<main>
    <section class="pane editor-pane">
        <textarea id="editor" placeholder="Start typing..." oninput="update()"></textarea>
    </section>

    <section class="pane">
        <div id="preview"></div>
    </section>
</main>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    // Live update and storage
    function update() {
        const content = editor.value;
        preview.innerHTML = marked.parse(content);
        localStorage.setItem('md_content', content);
    }

    // File Handling
    document.getElementById('file-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            editor.value = ev.target.result;
            update();
        };
        reader.readAsText(file);
    });

    // High-Contrast PDF Generation
    async function exportPDF() {
        const element = document.createElement('div');
        element.className = 'pdf-export-container';
        element.innerHTML = marked.parse(editor.value);
        
        const opt = {
            margin: [15, 15, 15, 15],
            filename: 'document.pdf',
            image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { scale: 3, useCORS: true, logging: false },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            await html2pdf().set(opt).from(element).save();
        } catch (err) {
            alert("Export failed. Check console for details.");
        }
    }

    // Initialization
    window.onload = () => {
        const saved = localStorage.getItem('md_content');
        editor.value = saved || "# Welcome\n\nThis interface adapts to your screen size. \n\n### PDF Contrast\nExports now use **pure black text** on a **pure white background** regardless of your system theme.";
        update();
    };
</script>

</body>
</html>
