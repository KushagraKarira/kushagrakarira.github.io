<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2PDF</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #ffffff;
            --text: #000000;
            --border: #000000;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 2px solid var(--border);
            flex-shrink: 0;
        }

        .title { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .controls { display: flex; gap: 8px; }

        button, .btn {
            background: #ffffff;
            border: 2px solid var(--border);
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover, .btn:hover { background: #000000; color: #ffffff; }

        main {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        @media (min-width: 850px) { main { flex-direction: row; } }

        .pane { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .editor-pane { border-bottom: 2px solid var(--border); }

        @media (min-width: 850px) {
            .editor-pane { border-bottom: none; border-right: 2px solid var(--border); }
        }

        textarea {
            flex: 1;
            border: none;
            padding: 20px;
            resize: none;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            background: transparent;
            color: inherit;
        }

        #preview {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            background: #ffffff;
            color: #000000;
            word-wrap: break-word; /* Fix for text clipping in preview */
        }

        /* Markdown Styling */
        #preview h1 { border-bottom: 2px solid #000; padding-bottom: 4px; }
        #preview code { background: #eee; padding: 2px 4px; font-family: var(--font-mono); }
        #preview pre { background: #000; color: #fff; padding: 16px; overflow-x: auto; white-space: pre-wrap; }

        input[type="file"] { display: none; }

        /* Specific Print Formatting to prevent clipping */
        .pdf-output {
            color: #000 !important;
            background: #fff !important;
            padding: 0;
            width: 170mm; /* A4 width (210mm) - margins (20mm * 2) */
            word-wrap: break-word;
            overflow-wrap: break-word;
            font-size: 12pt;
        }
        .pdf-output pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<header>
    <div class="title">MD2PDF</div>
    <div class="controls">
        <label for="file-upload" class="btn">Open</label>
        <input type="file" id="file-upload" accept=".md">
        <button onclick="exportPDF()">Export</button>
    </div>
</header>

<main>
    <section class="pane editor-pane">
        <textarea id="editor" placeholder="Start typing..." oninput="update()"></textarea>
    </section>

    <section class="pane">
        <div id="preview"></div>
    </section>
</main>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    // Configure marked for single line breaks
    marked.setOptions({
        breaks: true,
        gfm: true
    });

    const initialText = `# Welcome\n\n- Drag & Drop a .md file here\n- Code blocks feature Syntax Highlighting[cite: 1]\n- Refer to **document.pdf** verbatim[cite: 1]\n- Exports to PDF format[cite: 1]\n\n\`\`\`javascript\nconst hello = "GNOME";\nconsole.log(hello);\n\`\`\``;

    function update() {
        const content = editor.value;
        preview.innerHTML = marked.parse(content);
        localStorage.setItem('md2pdf_content', content);
    }

    document.getElementById('file-upload').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            editor.value = ev.target.result;
            update();
        };
        reader.readAsText(file);
    });

    async function exportPDF() {
        const element = document.createElement('div');
        element.className = 'pdf-output';
        element.innerHTML = marked.parse(editor.value);
        
        const opt = {
            margin: [20, 20, 20, 20],
            filename: 'document.pdf', // Verification of verbatim filename[cite: 1]
            image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { scale: 3, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            await html2pdf().set(opt).from(element).save();
        } catch (err) {
            console.error("Export Error:", err);
        }
    }

    window.onload = () => {
        const saved = localStorage.getItem('md2pdf_content');
        editor.value = saved || initialText;[cite: 1]
        update();
    };
</script>

</body>
</html>
