<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD2PDF</title>
    <!-- External Assets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <style>
        :root {
            --bg: #242424;
            --header: #303030;
            --card: #2d2d2d;
            --text: #ffffff;
            --text-dim: #9a9996;
            --accent: #3584e4;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--header);
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .logo { font-size: 15px; font-weight: 700; letter-spacing: 0.5px; }
        .actions { display: flex; gap: 10px; }

        button, .btn-file {
            background-color: #3d3d3d;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover { background-color: #4d4d4d; }
        button.primary { background-color: var(--accent); border: none; }
        button.primary:hover { background-color: #1c71d8; }

        main {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 12px;
            gap: 12px;
            overflow: hidden;
        }

        @media (min-width: 900px) {
            main { flex-direction: row; padding: 24px; gap: 24px; }
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        .label {
            padding: 10px 16px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border);
        }

        textarea {
            flex: 1;
            border: none;
            padding: 20px;
            resize: none;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            line-height: 1.6;
            outline: none;
            background: transparent;
            color: white;
        }

        /* Preview and PDF Export Styles */
        #preview, .pdf-export-box {
            background: white !important;
            color: black !important;
            line-height: 1.6;
            word-wrap: break-word;
        }

        #preview {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        /* Table Styling Requirements */
        #preview table, .pdf-export-box table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
            border: 1px solid black !important;
            break-inside: avoid; /* Prevents splitting across pages */
            page-break-inside: avoid;
        }

        #preview th, #preview td, 
        .pdf-export-box th, .pdf-export-box td {
            border: 1px solid black !important;
            padding: 8px;
            text-align: left;
        }

        #preview h1 { border-bottom: 1px solid #eee; margin-top: 0; }
        #preview pre { background: #f6f8fa; padding: 16px; border-radius: 8px; white-space: pre-wrap; }

        input[type="file"] { display: none; }

        .pdf-export-box {
            width: 170mm;
            padding: 0;
            font-family: 'Inter', sans-serif;
            font-size: 11pt;
            position: absolute;
            left: -9999px;
            top: 0;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">MD2PDF</div>
    <div class="actions">
        <label for="file-up" class="btn-file">Open</label>
        <input type="file" id="file-up" accept=".md">
        <button id="export-btn" class="primary" onclick="doExport()">Export</button>
    </div>
</header>

<main>
    <section class="pane">
        <div class="label">Editor</div>
        <textarea id="editor" placeholder="Type here..."></textarea>
    </section>

    <section class="pane">
        <div class="label">Preview</div>
        <div id="preview"></div>
    </section>
</main>

<script>
    const ed = document.getElementById('editor');
    const pre = document.getElementById('preview');
    const exportBtn = document.getElementById('export-btn');
    let debounceTimer;

    marked.setOptions({ breaks: true, gfm: true });

    function render() {
        const val = ed.value;
        const dirtyHtml = marked.parse(val);
        const cleanHtml = DOMPurify.sanitize(dirtyHtml);
        pre.innerHTML = cleanHtml;
        localStorage.setItem('md2pdf_content', val);
    }

    // Input debouncing for performance
    ed.addEventListener('input', () => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(render, 150);
    });

    document.getElementById('file-up').onchange = function(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => { ed.value = ev.target.result; render(); };
        r.readAsText(f);
    };

    async function doExport() {
        exportBtn.disabled = true;
        const container = document.createElement('div');
        container.className = 'pdf-export-box';
        
        // Ensure export-only container has sanitized content
        container.innerHTML = DOMPurify.sanitize(marked.parse(ed.value));
        document.body.appendChild(container);
                
        const opt = {
            margin: [20, 20, 20, 20],
            filename: 'document.pdf',
            image: { type: 'jpeg', quality: 1.0 },
            html2canvas: { scale: 3, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        try {
            await html2pdf().set(opt).from(container).save();
        } catch (e) {
            console.error("PDF Export Failed:", e);
        } finally {
            document.body.removeChild(container);
            exportBtn.disabled = false;
        }
    }

    window.onload = () => {
        const saved = localStorage.getItem('md2pdf_content');
        ed.value = saved || "# MD2PDF\n\n| Feature | Status |\n| :--- | :--- |\n| Borders | Black |\n| Page Breaks | Avoided |\n\n- Type or upload a `.md` file.\n- Real-time preview.\n- Export to `document.pdf`.";
        render();
    };
</script>
</body>
</html>
