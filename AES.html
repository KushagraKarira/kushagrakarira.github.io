!DOCTYPE html>
<html>
<head>
    <title>AES-256 Message Encoder/Decoder</title>
</head>
<body>
    <h1>AES-256 Message Encoder/Decoder</h1>
    <label for="message">Message:</label>
    <br>
    <textarea id="message" rows="4" cols="50"></textarea>
    <br>
    <button onclick="encodeMessage()">Encode</button>
    <br><br>
    <label for="encryptionKey">Encryption Key:</label>
    <br>
    <textarea id="encryptionKey" rows="2" cols="50" readonly></textarea>
    <br><br>
    <label for="encoded">Encoded Message:</label>
    <br>
    <textarea id="encoded" rows="4" cols="50" readonly></textarea>
    <br><br>
    <label for="decryptionKey">Decryption Key:</label>
    <br>
    <textarea id="decryptionKey" rows="2" cols="50"></textarea>
    <br>
    <button onclick="decodeMessage()">Decode</button>
    <br><br>
    <label for="decoded">Decoded Message:</label>
    <br>
    <textarea id="decoded" rows="4" cols="50" readonly></textarea>
    <br><br>
    <label for="error" style="color: red;">Error:</label>
    <br>
    <span id="error"></span>
    
    <script>
        async function encodeMessage() {
            const message = document.getElementById('message').value;
            
            try {
                const { encodedMessage, encryptionKey } = await encryptMessage(message);
                document.getElementById('encoded').value = encodedMessage;
                document.getElementById('encryptionKey').value = encryptionKey;
                clearError();
            } catch (error) {
                displayError('Encryption failed: ' + error);
            }
        }
        
        async function decodeMessage() {
            const encodedMessage = document.getElementById('encoded').value;
            const decryptionKey = document.getElementById('decryptionKey').value;
            
            try {
                const decodedMessage = await decryptMessage(encodedMessage, decryptionKey);
                document.getElementById('decoded').value = decodedMessage;
                clearError();
            } catch (error) {
                displayError('Decryption failed: ' + error);
            }
        }
        
        async function encryptMessage(message) {
            try {
                const encoder = new TextEncoder();
                const encodedMessage = encoder.encode(message);
                
                const key = await crypto.subtle.generateKey(
                    { name: 'AES-CBC', length: 256 },
                    true,
                    ['encrypt', 'decrypt']
                );
                
                const iv = crypto.getRandomValues(new Uint8Array(16));
                
                const ciphertext = await crypto.subtle.encrypt(
                    { name: 'AES-CBC', iv },
                    key,
                    encodedMessage
                );
                
                const encodedCiphertext = Array.from(new Uint8Array(ciphertext))
                    .map(byte => String.fromCharCode(byte))
                    .join('');
                
                const encryptionKey = await crypto.subtle.exportKey('raw', key);
                const encryptionKeyString = btoa(String.fromCharCode(...new Uint8Array(encryptionKey)));
                
                return { encodedMessage: btoa(ivToString(iv) + encodedCiphertext), encryptionKey: encryptionKeyString };
            } catch (error) {
                throw new Error('Encryption failed: ' + error.message);
            }
        }
        
        async function decryptMessage(encodedMessage, decryptionKey) {
    try {
        const decoder = new TextDecoder();
        const decodedMessage = atob(encodedMessage);
        
        const iv = stringToIV(decodedMessage.substring(0, 24));
        const encodedCiphertext = decodedMessage.substring(24);
        
        const key = await crypto.subtle.importKey(
            'raw',
            Uint8Array.from(atob(decryptionKey), c => c.charCodeAt(0)),
            { name: 'AES-CBC', length: 256 },
            false,
            ['decrypt']
        );
        
        const ciphertext = new Uint8Array(encodedCiphertext.length);
        for (let i = 0; i < encodedCiphertext.length; i++) {
            ciphertext[i] = encodedCiphertext.charCodeAt(i);
        }
        
        const decryptedData = await crypto.subtle.decrypt(
            { name: 'AES-CBC', iv },
            key,
            ciphertext.buffer  // Use ArrayBuffer instead of Uint8Array
        );
        
        const decodedText = decoder.decode(decryptedData);
        return decodedText;
    } catch (error) {
        throw new Error('Decryption failed: ' + error.message);
    }
}

        
        function ivToString(iv) {
            let ivString = '';
            for (let i = 0; i < iv.byteLength; i++) {
                ivString += String.fromCharCode(iv[i]);
            }
            return ivString;
        }
        
        function stringToIV(ivString) {
            const iv = new Uint8Array(16);
            for (let i = 0; i < ivString.length; i++) {
                iv[i] = ivString.charCodeAt(i);
            }
            return iv;
        }
        
        function displayError(message) {
            document.getElementById('error').textContent = message;
        }
        
        function clearError() {
            document.getElementById('error').textContent = '';
        }
    </script>
</body>
</html>
